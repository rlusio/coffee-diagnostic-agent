services:
  ollama:
    image: ollama/ollama
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  app:
    build: .
    environment:
      OLLAMA_HOST: http://ollama:11434
      REVIEW_DB_PATH: /var/lib/coffee-agent/review_queue.sqlite3
    volumes:
      - submissions:/var/lib/coffee-agent
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  models:
  submissions:
